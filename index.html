<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1557d6">
<title>DigiPonte</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f7fd;--card:#fff;--tx:#0f1b33;--mu:#5a6781;--br:#1557d6;--br2:#e5eefc;--ac:#38a8f5;--bd:#d8e2f2;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1224;--card:#111b33;--tx:#e8eefb;--mu:#9aa9c6;--br:#5b9bff;--br2:#172a52;--bd:#22325a}}
:root[data-theme="dark"]{--bg:#0a1224;--card:#111b33;--tx:#e8eefb;--mu:#9aa9c6;--br:#5b9bff;--br2:#172a52;--bd:#22325a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:72px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:26px;color:var(--tx);cursor:pointer}.logo span{color:var(--br)}.logo svg{width:44px;height:44px}
.ib{background:none;border:0;color:var(--tx);position:relative;cursor:pointer;padding:6px;display:flex}#bell{margin-left:auto}nav svg{display:block}
.hero{background:linear-gradient(160deg,#061a4a,#0a3a9c 55%,#0a5de0);color:#fff;margin:-14px -14px 0;padding:24px 18px 70px}.hero h1{font-size:34px;line-height:1.1;margin:16px 0 12px}.hero h1 em{color:#3b92ff;font-style:normal}
.pill{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);border-radius:30px;padding:8px 14px;font-size:15px}
.sb{display:flex;background:#fff;border-radius:40px;padding:6px 6px 6px 16px;align-items:center;gap:8px;color:#5a6781;margin-top:18px}.sb input{border:0;margin:0;background:none;color:#0f1b33;padding:8px 0;outline:0}
.btn.w{background:#fff;color:#0a2a6b;border-radius:30px;padding:14px 22px;font-size:17px}.btn.o{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:30px;padding:14px 26px;font-size:17px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:20px;margin:-48px 0 22px;position:relative;box-shadow:0 8px 24px rgba(10,40,120,.15);padding:16px 6px;text-align:center;font-size:13px;color:var(--tx)}.trust svg{color:var(--br)}
.cats{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px}.cat{min-width:150px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;cursor:pointer;font-weight:700}.cat i{width:44px;height:44px;border-radius:50%;background:var(--br);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.demo{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:14px}.demo .ico{width:46px;height:46px;border-radius:50%;background:var(--br2);color:var(--br);display:flex;align-items:center;justify-content:center}.pill2{background:#fdeed4;color:#c77700;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;margin-left:auto}
main{max-width:960px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{background:none;border:0;color:var(--mu);font-family:inherit;font-weight:600;font-size:12px;padding:6px 8px;position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}nav button.on{color:var(--br)}
.badge{position:absolute;top:0;right:2px;background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:0 5px}
